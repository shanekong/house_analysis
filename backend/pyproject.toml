[project]
name = "house-analysis-backend"
version = "0.1.0"
description = "杭州住宅决策分析的数据与后端服务"
requires-python = ">=3.9"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "pymysql>=1.1,<2",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
house-db = "house_analysis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/house_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
